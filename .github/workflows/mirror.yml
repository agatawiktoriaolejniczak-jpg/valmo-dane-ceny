name: Kopia danych o cenach dla dane.gov.pl

on:
  schedule:
    - cron: "45 3 * * *"   # po nocnej generacji danych na stronie (03:15 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz dane ze strony dewelopera i przepisz adresy
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re, urllib.request

          ZRODLO = "https://domyboduszyn.pl"
          RAW = "https://raw.githubusercontent.com/agatawiktoriaolejniczak-jpg/valmo-dane-ceny/main"
          dane = pathlib.Path("dane"); dane.mkdir(exist_ok=True)

          def pobierz(adres):
              with urllib.request.urlopen(adres, timeout=60) as r:
                  return r.read()

          xml = pobierz(f"{ZRODLO}/dane/dane-gov-pl.xml").decode("utf-8")

          # adresy plikow dziennych musza wskazywac na ta kopie, inaczej portal
          # pobieralby CSV z serwera, ktory byl dla niego nieosiagalny
          pliki = re.findall(r"https://domyboduszyn\.pl/dane/([^<]+\.csv)", xml)
          for nazwa in pliki:
              (dane / nazwa).write_bytes(pobierz(f"{ZRODLO}/dane/{nazwa}"))
          xml = xml.replace(f"{ZRODLO}/dane/", f"{RAW}/dane/")

          pathlib.Path("dane-gov-pl.xml").write_text(xml, encoding="utf-8")
          suma = hashlib.md5(xml.encode("utf-8")).hexdigest()
          pathlib.Path("dane-gov-pl.md5").write_text(suma + "\n", encoding="utf-8")
          print(f"plikow dziennych: {len(pliki)} | md5: {suma}")
          PY

      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet --cached || git commit -m "Kopia danych o cenach $(date -u +%Y-%m-%d)"
          git push
